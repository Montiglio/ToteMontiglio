
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Mappa delle Meridiane</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #202020;
  }
  #mappa {
    width: 100%;
    height: 100%;
  }
  #titolo {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 12px 18px;
    background: rgba(255,255,255,0.95);
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    pointer-events: none;
  }
  #avviso {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 10;
    width: max-content;
    max-width: min(80vw, 480px);
    padding: 16px 22px;
    transform: translate(-50%, -50%);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.94);
    color: #222;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: bold;
    line-height: 1.4;
    text-align: center;
    pointer-events: none;
  }
  #comandi {
    position: absolute;
    right: 18px;
    bottom: 25px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button,
  #indietro {
    min-width: 70px;
    min-height: 65px;
    border: 0;
    border-radius: 10px;
    background: white;
    color: #222;
    font-size: 25px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #indietro {
    position: absolute;
    left: 18px;
    bottom: 25px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
  }
  #indietro:focus-visible {
    outline: 4px solid #ffd54f;
    outline-offset: 3px;
  }
  @media (max-width: 480px) {
    #indietro {
      bottom: 275px;
    }
  }
</style>
</head>
<body>

<div id="mappa"></div>

<div id="titolo">Mappa delle Meridiane</div>
<div id="avviso" role="status" aria-live="polite">Tocca lo schermo per vedere la mappa</div>

<a id="indietro" href="../index.html">← Torna ai punti di interesse</a>

<div id="comandi">
  <button id="zoomIn" aria-label="Ingrandisci">+</button>
  <button id="zoomOut" aria-label="Riduci">−</button>
  <button id="reset" aria-label="Vista completa">⌂</button>
</div>

<script src="openseadragon.min.js"></script>
<script>
const notice = document.getElementById("avviso");
let language = "it";
try {
  language = sessionStorage.getItem("totem-language") === "en" ? "en" : "it";
} catch (error) {
  console.warn("Impossibile leggere la lingua selezionata nel totem.", error);
}
document.documentElement.lang = language;
notice.textContent = language === "en"
  ? "Touch the screen to view the map"
  : "Tocca lo schermo per vedere la mappa";
document.getElementById("mappa").addEventListener("pointerdown", () => {
  notice.hidden = true;
}, { once: true });

const viewer = OpenSeadragon({
  id: "mappa",
  prefixUrl: "images/",
  showNavigationControl: false,
  gestureSettingsTouch: {
    pinchToZoom: true,
    dragToPan: true,
    flickEnabled: false
  },
  tileSources: {
  type: "image",
  url: "mappa_meridiane.png"
},
  homeFillsViewer: false,
  visibilityRatio: 0.8,
  minZoomImageRatio: 0.8,
  maxZoomPixelRatio: 2
});

document.getElementById("zoomIn").onclick =
  () => viewer.viewport.zoomBy(1.5);

document.getElementById("zoomOut").onclick =
  () => viewer.viewport.zoomBy(1 / 1.5);

document.getElementById("reset").onclick =
  () => viewer.viewport.goHome();
</script>

</body>
</html>
